<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Rancho&family=Sacramento&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rancho&family=Sacramento&display=swap" rel="stylesheet">
</head>
<body>
    <div class="imgLeft">
        <img src="img/Rectangle 289.png" alt="Latte Art">
    </div>
    <div class="main">
        <div class="header">
            <div class="logo">
                <img class="cslogo" src="icon/coffee.svg" alt="">
            </div>
            <div class="name">
                <h1>Coffee Shop</h1>
            </div>
        </div>
        <div class="register-form">
            <div class="register">
                <h2>Register</h2>
                <p>Fill out the form correctly</p>
            </div>
            <div class="container">
                <div class="title">
                    <h3>Full Name</h3>
                    <div class="form">
                        <img class="icon" src="icon/Profile.svg" alt="">
                        <input class="input" type="text" placeholder="Enter Your Full Name">
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="title">
                    <h3>Email</h3>
                    <div class="form">
                        <img class="icon" src="icon/mail.svg" alt="">
                        <input class="input" type="text" placeholder="Enter Your Email">
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="title">
                    <h3>Password</h3>
                    <div class="form">
                        <img class="icon" src="icon/Password.svg" alt="">
                        <input class="input" type="text" placeholder="Enter Your Password">
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="title">
                    <h3>Confirm Password</h3>
                    <div class="form">
                        <img class="icon" src="icon/Password.svg" alt="">
                        <input class="input" type="text" placeholder="Enter Your Password Again">
                    </div>
                </div>
            </div>
            <div >
                <button class="button-reg">Register</button>
            </div>
        </div>
    </div>
</body>
</html>
