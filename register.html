<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Rancho&family=Sacramento&display=swap"
        rel="stylesheet">
</head>

<body class="register-page">
    <div>
        <img src="img/Rectangle 289.png" alt="Latte Art">
    </div>
    <div>
        <div class="logo">
            <div>
                <img src="icon/coffee.svg" alt="">
            </div>
            <div>
                <h1>Coffee Shop</h1>
            </div>
        </div>
        <div>
            <h2>Register</h2>
            <p>Fill out the form correctly</p>
            <div class="input-box">
                <h3>Full Name</h3>
                <div class="form">
                    <img class="icon" src="icon/Profile.svg" alt="">
                    <input class="input" type="text" placeholder="Enter Your Full Name">
                </div>
            </div>
            <div class="input-box">
                <h3>Email</h3>
                <div class="form">
                    <img class="icon" src="icon/mail.svg" alt="">
                    <input class="input" type="text" placeholder="Enter Your Email">
                </div>
            </div>
            <div class="input-box">
                <h3>Password</h3>
                <div class="form">
                    <img class="icon" src="icon/Password.svg" alt="">
                    <input class="input" type="text" placeholder="Enter Your Password">
                    <img class="eye" src="icon/EyeSlash.svg" alt="">
                </div>
            </div>
            <div class="input-box">
                <h3>Confirm Password</h3>
                <div class="form">
                    <img class="icon" src="icon/Password.svg" alt="">
                    <input class="input" type="text" placeholder="Enter Your Password Again">
                    <img class="eye" src="icon/EyeSlash.svg" alt="">
                </div>
            </div>
            <div class="reg-bawah">
                <button type="submit">Register</button>
                <p>Have An Account? <a href="login.html">Login</a></p>
                <p>Or</p>
            </div>
            <div class="fbgoogle">
                <a href="https://www.facebook.com/"><img class="icon-fb" src="icon/facebook.svg" alt=""><p>Facebook</p></a>
                <a href="https://www.google.com/"><img class="icon-google" src="icon/google.svg" alt=""><p>Google</p></a>
            </div>
        </div>
    </div>
</body>

</html>
