<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Rancho&family=Sacramento&display=swap"
        rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<body class="register-page">
    <div>
        <img src="img/login-barista.svg" alt="Barista">
    </div>
    <div>
        <div class="logo">
            <div>
                <img src="icon/coffee.svg" alt="">
            </div>
            <div>
                <h1>Coffee Shop</h1>
            </div>
        </div>
        <form id="loginForm">
            <h2>Login</h2>
            <p>Fill out the form correctly</p>
            <div class="input-box">
                <h3>Email</h3>
                <div class="form">
                    <img class="icon" src="icon/mail.svg" alt="">
                    <input class="input" type="email" id="loginEmail" name="email" placeholder="Enter Your Email" required>
                </div>
            </div>
            <div class="input-box">
                <h3>Password</h3>
                <div class="form">
                    <img class="icon" src="icon/Password.svg" alt="">
                    <input class="input" type="password" id="loginPassword" name="password" placeholder="Enter Your Password" required>
                    <img class="eye" src="icon/EyeSlash.svg" alt="">
                </div>
            </div>
            <div class="forgot-pw"><a href="forgot-password.html">Forgot Password?</a></div>
            <button type="submit">Login</button>
        </form>
            <div class="reg-bawah">
                <p>Not Have An Account? <a href="register.html">Register</a></p>
                <p>Or</p>
            </div>
            <div class="fbgoogle">
                <a href="https://www.facebook.com/"><img class="icon-fb" src="icon/facebook.svg" alt=""><p>Facebook</p></a>
                <a href="https://www.google.com/"><img class="icon-google" src="icon/google.svg" alt=""><p>Google</p></a>
    <script>
        $(document).ready(function () {
            const users = JSON.parse(localStorage.getItem("users")) || [];

            if (users.length === 0) {
                const admin = {
                    fullName: "Admin",
                    email: "koda@mail.com",
                    password: "1234"
                }
                users.push(admin)
                localStorage.setItem("users", JSON.stringify(users))
            }

            $("#loginForm").on("submit", function(e) {
                e.preventDefault()

                const email = $("#loginEmail").val().trim()
                const password = $("#loginPassword").val()

                if (!email || !password) {
                    alert("Please fill all fields")
                    return
                }

                const user = users.find(u => u.email === email && u.password === password)

                if (user) {
                    alert("Login successful! Welcome " + user.fullName)
                    
                    localStorage.setItem("currentUser", JSON.stringify(user))
                    
                    this.reset()
                    window.location.href = "index.html"
                } else {
                    alert("Invalid email or password")
                }
            })
        })
    </script>
</html>
