<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password Page</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Rancho&family=Sacramento&display=swap"
        rel="stylesheet">
</head>

<body class="register-page">
    <div>
        <img src="img/forgot-password-img.svg" alt="Barista">
    </div>
    <div>
        <div class="logo">
            <div>
                <img src="src/assets/icon/coffee.svg" alt="">
            </div>
            <div>
                <h1>Coffee Shop</h1>
            </div>
        </div>
        <div>
            <h2>Fill out the form correctly</h2>
            <p>We will send new password to your email</p>
            <form>
                <div class="input-box">
                    <h3>Email</h3>
                    <div class="form">
                        <img class="icon" src="src/assets/icon/mail.svg" alt="">
                        <input class="input" type="text" placeholder="Enter Your Email">
                    </div>
                </div>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
</body>

</html>
